name: Build de prévia (não publica)

on:
  push:
    branches: [melhorias-conversao]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Guarda o site montado no ramo "previa-dist" (só para conferência; não vai ao ar).
      - run: |
          cd dist
          git init -q
          git checkout -q -b previa-dist
          git add -A
          git -c user.name="previa-bot" -c user.email="previa-bot@users.noreply.github.com" commit -qm "Prévia de ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" previa-dist
